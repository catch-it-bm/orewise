name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orewise-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orewise-admin/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
