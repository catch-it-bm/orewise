# Orewise self-host / dev stack. Ollama is NOT included: see deploy/ollama.
# Build jars first: mvn -B package -DskipTests (from repo root)
name: orewise

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orewise
      POSTGRES_USER: orewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orewise}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orewise -d orewise"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: orewise
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-orewise}
      # Public URL used in tokens (issuer); containers still reach it as keycloak:8080.
      KC_HOSTNAME: ${OREWISE_KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Dev only. Production self-host must enable the security plugin.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    ports:
      - "9200:9200"

  orewise-api:
    build:
      context: ../..
      dockerfile: deploy/docker/java.Dockerfile
      args:
        MODULE: orewise-api
    image: orewise/orewise-api:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${OREWISE_PROFILES:-dev}
      OREWISE_DB_URL: jdbc:postgresql://postgres:5432/orewise
      OREWISE_DB_PASSWORD: ${POSTGRES_PASSWORD:-orewise}
      OREWISE_OIDC_ISSUER: ${OREWISE_KEYCLOAK_URL:-http://localhost:8180}/realms/orewise
      OREWISE_OIDC_JWKS: http://keycloak:8080/realms/orewise/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  orewise-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/java.Dockerfile
      args:
        MODULE: orewise-worker
    image: orewise/orewise-worker:dev
    # Restarts until orewise-api has applied the Flyway migrations.
    restart: unless-stopped
    environment:
      OREWISE_DB_URL: jdbc:postgresql://postgres:5432/orewise
      OREWISE_DB_PASSWORD: ${POSTGRES_PASSWORD:-orewise}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  orewise-admin:
    build: ../../orewise-admin
    image: orewise/orewise-admin:dev
    ports:
      - "8081:80"
    depends_on:
      - orewise-api

volumes:
  pgdata:
  osdata:
