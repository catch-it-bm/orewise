spring:
  application:
    name: orewise-api
  datasource:
    url: ${OREWISE_DB_URL:jdbc:postgresql://localhost:5432/orewise}
    username: ${OREWISE_DB_USER:orewise}
    password: ${OREWISE_DB_PASSWORD:orewise}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer = public Keycloak URL (as seen by browsers); JWKS may use the internal URL.
          issuer-uri: ${OREWISE_OIDC_ISSUER:http://localhost:8180/realms/orewise}
          jwk-set-uri: ${OREWISE_OIDC_JWKS:http://localhost:8180/realms/orewise/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
